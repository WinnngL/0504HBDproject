<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>gift</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: #FFFDEE;
            overflow: hidden;
            font-family: "Microsoft YaHei", Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gift-wrapper {
            position: relative;
            width: min(80vw, 360px);
            height: min(60vh, 450px);
            cursor: pointer;
            user-select: none;
        }

        /* 礼物图片公共样式 */
        .gift-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: opacity 0.8s ease, filter 0.6s ease;
        }

        .gift-cover { z-index: 3; opacity: 1; }
        .gift-uncover { z-index: 2; opacity: 0; }
        .gift-final { z-index: 1; opacity: 0; }

        /* 状态控制 */
        .gift-wrapper.stage1 .gift-cover { opacity: 0; }
        .gift-wrapper.stage1 .gift-uncover { opacity: 1; }
        .gift-wrapper.stage2 .gift-uncover { opacity: 0; }
        .gift-wrapper.stage2 .gift-final { opacity: 1; }
        .gift-wrapper.stage3 .gift-final { filter: blur(5px); }

        /* 底部提示 */
        .hint {
            position: absolute;
            bottom: -2.5rem;
            left: 50%;
            transform: translateX(-50%);
            color: #917b10;
            font-size: 1rem;
            white-space: nowrap;
            animation: fadeHint 2s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes fadeHint {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 1; }
        }
        #hint2, #hint3 { display: none; }

        /* 高清原图提示 - 图片下方 */
        .info-text {
            position: absolute;
            bottom: -1rem;
            left: 50%;
            transform: translateX(-50%);
            color: #654a09;
            font-size: 1.1rem;
            font-weight: bold;
            background: rgba(255, 253, 238, 0.85);
            padding: 12px 20px;
            border-radius: 14px;
            text-align: center;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s;
            white-space: nowrap;
        }
        .gift-wrapper.stage2 .info-text { opacity: 1; }
        .gift-wrapper.stage3 .info-text { opacity: 0; }

        /* 祝福文字层 */
        .blessing {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 11;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.8s;
            max-width: 90vw;
        }
        .gift-wrapper.stage3 .blessing { opacity: 1; }

        .blessing p {
            margin: 0.5em 0;
            font-weight: bold;
            color: #b0801e;
            text-shadow: 0 2px 12px rgba(255, 253, 238, 0.9);
            white-space: nowrap;          /* 强制单行，确保两行整体 */
        }

        /* 第一行中文：较大字号，自适应 */
        .blessing .line1 {
            font-size: clamp(1.4rem, 5vw, 2.2rem);
        }

        /* 第二行英文：稍小字号，但保持一行 */
        .blessing .line2 {
            font-size: clamp(0.9rem, 3vw, 1.4rem);
            color: #917b10;
        }

        /* 移动端细微调整（仍然保留clamp自动缩放） */
        @media (max-width: 600px) {
            .info-text {
                font-size: 0.9rem;
                bottom: -0.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="gift-wrapper" id="giftWrapper">
        <!-- 礼物图片 -->
        <img class="gift-img gift-cover" src="cover.png" alt="包装礼物">
        <img class="gift-img gift-uncover" src="uncover.png" alt="拆开礼物">
        <img class="gift-img gift-final" src="gift.png" alt="惊喜礼物">

        <!-- 高清原图提示 -->
        <div class="info-text">高清原图，请联系系统管理员小林获取</div>

        <!-- 祝福文字 -->
        <div class="blessing" id="blessing">
            <p class="line1">生日快乐，平安喜乐！</p>
            <p class="line2">Good morning, good afternoon and good night~</p>
        </div>

        <!-- 操作提示 -->
        <div class="hint" id="hint1">点击打开礼物</div>
        <div class="hint" id="hint2">再点击拆开礼物</div>
        <div class="hint" id="hint3">点击以继续</div>
    </div>

    <script>
        const wrapper = document.getElementById('giftWrapper');
        const hint1 = document.getElementById('hint1');
        const hint2 = document.getElementById('hint2');
        const hint3 = document.getElementById('hint3');

        let state = 0;
        wrapper.addEventListener('click', () => {
            if (state === 0) {
                wrapper.classList.add('stage1');
                hint1.style.display = 'none';
                hint2.style.display = 'block';
                state = 1;
            } else if (state === 1) {
                wrapper.classList.add('stage2');
                hint2.style.display = 'none';
                hint3.style.display = 'block';
                state = 2;
            } else if (state === 2) {
                wrapper.classList.add('stage3');
                hint3.style.display = 'none';
                state = 3;
            }
        });
    </script>
</body>
</html>
