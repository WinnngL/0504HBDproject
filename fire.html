<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>fire</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
        html, body {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            background: #FFFDEE;
            overflow: hidden;
            font-family: "Microsoft YaHei", Arial, sans-serif;
            position: relative;
        }
        #bgfade {
            position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; z-index: 0;
            background: #FFFDEE;
            animation: nightFall 40s cubic-bezier(.62,.22,.12,.94) forwards;
            pointer-events: none;
        }
        @keyframes nightFall {
            0%   { background: #FFFDEE; }
            40%  { background: #ffe9bb; }
            70%  { background: #4a5977; }
            100% { background: #0a1f2f; }
        }
        .stars {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 3;
        }
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 6px 2px rgba(255,255,200,0.8);
            opacity: 0.2;
            animation: twinkle 2s infinite alternate;
        }
        @keyframes twinkle {
            0% { opacity: 0.2; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1); }
        }
        #fireworkCanvas {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 2;
        }
        /* 弹窗 */
        #modalMask {
            position: fixed; left: 0; top: 0; width: 100vw; height: 100vh;
            background: rgba(32,32,32,0.12); z-index: 20;
            display: flex; align-items: center; justify-content: center;
            transition: opacity .5s;
            opacity: 0;
            pointer-events: none;
        }
        #modalMask.show {
            opacity: 1;
            pointer-events: auto;
        }
        #modalDialog {
            background: #fffdeebc;
            border-radius: 24px;
            box-shadow: 0 4px 40px #d6b82b38;
            min-width: 230px; max-width: 80vw;
            padding: 36px 34px 32px 34px;
            text-align: center;
            font-family: "Microsoft YaHei", sans-serif;
            color: #654a09;
            font-size: 1.22rem;
            display: flex; flex-direction: column; align-items: center;
            opacity: 0;
            transform: translateY(30px) scale(0.98);
            animation: modalIn .9s cubic-bezier(.42,.28,.51,1.29) forwards;
        }
        @keyframes modalIn {
            from { opacity: 0; transform: translateY(30px) scale(0.98); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }
        #modalDialogBtn {
            margin-top: 22px;
            padding: 14px 38px;
            font-size: 1.18rem;
            border: none;
            background: linear-gradient(120deg, #fffdea 80%, #ffe972 100%);
            border-radius: 14px;
            color: #7a560e;
            font-family: "Microsoft YaHei", sans-serif;
            box-shadow: 0 2px 18px #fdcd3270;
            cursor: pointer;
            font-weight: 500;
            letter-spacing: 2px;
        }
        #modalDialogBtn:active, #modalDialogBtn:hover {
            background: #ffeec0;
            color: #b4840e;
        }
        /* 提示文字 */
        #guideMsg {
            position: fixed;
            left: 50%; top: 50%;
            transform: translate(-50%, -50%);
            z-index: 19;
            padding: 20px 40px;
            background: rgba(40,34,10,0.16);
            border-radius: 23px;
            font-size: 1.5rem;
            color: #fbe38c;
            font-weight: 600;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            animation: hintBreathe 3s cubic-bezier(.6,0,.80,1);
        }
        @keyframes hintBreathe {
            0%   { opacity: 0; transform: translate(-50%, -40px) scale(0.94); }
            15%  { opacity: .7; }
            25%  { opacity: 1; transform: translate(-50%, 0) scale(1); }
            85%  { opacity: 1; }
            100% { opacity: 0; transform: translate(-50%, 0) scale(1); }
        }
        /* 右下角 continue 按钮 —— 关键修正：默认无动画，隐藏 */
        #continueBtn {
            position: fixed;
            right: 6vw;
            bottom: calc(5vh + env(safe-area-inset-bottom, 10px));
            z-index: 21;
            background: none;
            border: none;
            color: #ffe9bb;
            font-size: 1.28rem;
            font-family: "Microsoft YaHei", Arial, sans-serif;
            font-weight: 600;
            letter-spacing: 1px;
            padding: 16px 36px;
            opacity: 0;                 /* 一开始完全透明 */
            pointer-events: none;       /* 不可点击 */
            display: flex;
            align-items: center;
            gap: 10px;
            transition: opacity 1.2s;   /* 过渡效果（备用） */
        }
        /* 显示状态：添加呼吸动画 */
        #continueBtn.show {
            opacity: 0.98;
            pointer-events: auto;
            animation: breatheBtn 1.7s ease-in-out infinite;
        }
        @keyframes breatheBtn {
            0%, 100% { opacity: 0.53; }
            50% { opacity: 0.97; }
        }
        #continueBtn .icon {
            font-size: 1.55em;
            filter: drop-shadow(0px 1px 4px #ffe37244);
        }
    </style>
</head>
<body>
    <div id="bgfade"></div>
    <div class="stars" id="stars"></div>
    <canvas id="fireworkCanvas"></canvas>

    <div id="guideMsg" style="display:none;">点击屏幕试试看</div>

    <div id="modalMask">
        <div id="modalDialog">
            <div style="margin-bottom:18px;">请我看场烟花吧🎆</div>
            <button id="modalDialogBtn">行叭</button>
        </div>
    </div>

    <button id="continueBtn">
        <span class="icon">➡️</span>
        <span style="padding-left:2px;">continue</span>
    </button>

    <script>
        // 星空
        const starsContainer = document.getElementById('stars');
        for (let i = 0; i < 80; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.width = star.style.height = (Math.random() * 4 + 1) + 'px';
            star.style.animationDelay = Math.random() * 3 + 's';
            star.style.backgroundColor = Math.random() > 0.7 ? '#ffe9b0' : 'white';
            starsContainer.appendChild(star);
        }

        // 烟花画布
        const canvas = document.getElementById('fireworkCanvas');
        const ctx = canvas.getContext('2d');
        let width, height;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // 按钮 / 弹窗 / 提示
        const modalMask = document.getElementById('modalMask');
        const modalDialogBtn = document.getElementById('modalDialogBtn');
        const guideMsg = document.getElementById('guideMsg');
        const continueBtn = document.getElementById('continueBtn');

        // 1 秒后弹出弹窗
        setTimeout(() => {
            modalMask.classList.add('show');
        }, 1000);

        // 点击“不要”：关闭弹窗 → 出现提示 → 提示消失后 5 秒出现 continue 按钮
        modalDialogBtn.onclick = function() {
            modalMask.classList.remove('show');

            setTimeout(() => {
                guideMsg.style.display = "block";
                guideMsg.style.opacity = "1";   // 触发动画

                // 提示动画持续 3s，然后淡出
                setTimeout(() => {
                    guideMsg.style.opacity = "0";
                    setTimeout(() => {
                        guideMsg.style.display = "none";
                    }, 300);

                    // 提示消失后再等 5 秒显示 continue 按钮
                    const delayBeforeContinue = 5000;   // 👈 调这里可以改出现时间（毫秒）
                    setTimeout(() => {
                        continueBtn.classList.add('show');
                    }, delayBeforeContinue);

                }, 3000);   // 提示展示时间

            }, 700);   // 弹窗关闭后的延迟
        };

        // 点击 continue 跳转
        continueBtn.addEventListener('click', () => {
            window.location.href = 'car game.html';
        });

        // ---------- 烟花动画 ----------
        class Spark {
            constructor(x, y, color) {
                this.x = x; this.y = y;
                this.oldX = x; this.oldY = y;
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 2.5 + 0.5;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed - 0.2;
                this.gravity = 0.02;
                this.alpha = 1.0;
                this.decay = 0.006 + Math.random() * 0.005;
                this.color = color;
                this.lineWidth = 2.0 + Math.random() * 3.0;
            }
            update() {
                this.oldX = this.x;
                this.oldY = this.y;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
                if (this.alpha < 0) this.alpha = 0;
            }
            draw(ctx) {
                if (this.alpha <= 0) return;
                ctx.beginPath();
                ctx.moveTo(this.oldX, this.oldY);
                ctx.lineTo(this.x, this.y);
                ctx.strokeStyle = this.color;
                ctx.lineWidth = this.lineWidth * this.alpha;
                ctx.globalAlpha = this.alpha;
                ctx.shadowColor = this.color;
                ctx.shadowBlur = 10;
                ctx.stroke();
                ctx.shadowBlur = 0;
            }
        }

        let sparks = [];
        function createFirework(x, y) {
            const colors = [
                '#ff6b6b', '#ffd93d', '#6bcb77', '#4d96ff',
                '#ff922b', '#e040fb', '#00e5ff', '#ff6ec7'
            ];
            const mainColor = colors[Math.floor(Math.random() * colors.length)];
            const count = 35 + Math.floor(Math.random() * 25);
            for (let i = 0; i < count; i++) {
                sparks.push(new Spark(x, y, mainColor));
            }
            const whiteCount = 10 + Math.floor(Math.random() * 10);
            for (let i = 0; i < whiteCount; i++) {
                sparks.push(new Spark(x, y, '#ffffff'));
            }
        }

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            createFirework(x, y);
        });

        function animate() {
            ctx.fillStyle = 'rgba(10, 31, 47, 0.25)';
            ctx.fillRect(0, 0, width, height);
            for (let i = sparks.length - 1; i >= 0; i--) {
                const s = sparks[i];
                s.update();
                if (s.alpha <= 0) {
                    sparks.splice(i, 1);
                } else {
                    s.draw(ctx);
                }
            }
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
